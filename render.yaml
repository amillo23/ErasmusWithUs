services:
  - type: web
    name: erasmuswithus-api
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./ErasmusWithUs.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__EnableSsl
        value: "true"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__From
        sync: false
      - key: Email__FromName
        value: Erasmus With Us
      - key: Cors__AllowedOrigins
        value: https://erasmuswithus-frontend.onrender.com
      - key: Database__Path
        value: /tmp/erasmuswithus.db
      - key: CatalogReview__Key
        sync: false
      - key: AI__Endpoint
        sync: false
      - key: AI__ApiKey
        sync: false
      - key: AI__Model
        value: gpt-4o-mini

  - type: web
    name: erasmuswithus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://erasmuswithus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
